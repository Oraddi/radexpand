# Bir "v*" etiketi gonderilince: testler, imzali APK, Windows kurulum dosyasi ve ZIP -> GitHub Release.
# On a "v*" tag: tests, signed APK, Windows installer and ZIP -> GitHub Release.
#
# Gerekli depo sirlari / required repository secrets:
#   RADEXPAND_KEYSTORE_BASE64   imza anahtari (.jks) base64 / signing keystore as base64
#   RADEXPAND_STORE_PASSWORD, RADEXPAND_KEY_ALIAS, RADEXPAND_KEY_PASSWORD
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Version check
        id: ver
        run: |
          v=$(grep '^radexpandVersion=' gradle.properties | cut -d= -f2)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$v" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match gradle.properties version $v"; exit 1
          fi
      - name: Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RADEXPAND_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "Signing secret missing"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/radexpand.jks"
      - name: Unit tests + APK
        env:
          RADEXPAND_KEYSTORE: ${{ runner.temp }}/radexpand.jks
          RADEXPAND_STORE_PASSWORD: ${{ secrets.RADEXPAND_STORE_PASSWORD }}
          RADEXPAND_KEY_ALIAS: ${{ secrets.RADEXPAND_KEY_ALIAS }}
          RADEXPAND_KEY_PASSWORD: ${{ secrets.RADEXPAND_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :core:test :app:assembleRelease
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/RadExpand-${{ steps.ver.outputs.version }}.apk"
          # Sabit adli kopya: .../releases/latest/download/RadExpand.apk her zaman en yeni APK'yi indirir
          cp app/build/outputs/apk/release/app-release.apk out/RadExpand.apk
          rm -f "$RUNNER_TEMP/radexpand.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Installer + portable ZIP
        shell: pwsh
        run: |
          $v = ((Get-Content gradle.properties | Where-Object { $_ -like 'radexpandVersion=*' }) -split '=')[1]
          ./gradlew.bat --no-daemon :desktop:packageMsi :desktop:createDistributable
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item "desktop/build/compose/binaries/main/msi/RadExpand-$v.msi" "out/RadExpand-$v.msi"
          Compress-Archive -Path desktop/build/compose/binaries/main/app/RadExpand -DestinationPath "out/RadExpand-Windows-$v.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*

  release:
    needs: [android, windows]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from CHANGELOG
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '/^## /{p = index($0, "## " v) == 1; next} p' CHANGELOG.md > notes.md
          printf '\n---\nRadExpand bir tıbbi cihaz değildir. / RadExpand is not a medical device.\n' >> notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: RadExpand ${{ github.ref_name }}
          body_path: notes.md
          files: dist/*
